  summary: >
    Ervaren / Senior Cloud Specialist met focus op Security by Design, automatisering en het veilig en schaalbaar inrichten van cloudomgevingen.<br><br>
    Ik help organisaties sneller en veiliger te leveren door GitOps-principes, shift-left beveiliging en geautomatiseerde platformengineering te combineren.<br>
      - Met hands-on ervaring in o.a. Azure, AWS en GCP aangevuld met Kubernetes/OpenShift en CI/CD.<br>
      - Gericht op duurzame oplossingen die aantoonbaar compliant, onderhoudbaar en toekomstbestendig zijn. 
      - Ontwerpen en implementeren van landing zones, netwerk- en identity‑fundamenten, en CI/CD met geïntegreerde security (SAST/DAST, IaC‑scanning, SBOM).<br>
      - Ervaring met policy‑as‑code, zero‑trust‑principes, databeveiliging (Key/Secrets management) en doorlopende monitoring.<br>
      - Gericht op aantoonbare compliance (ISO 27001/NIST‑verwachtingen) en hoge beschikbaarheid/herstel (multi‑zone, DR).<br>
      - Sterk in het vertalen van risicobeheersing naar concrete guardrails.
